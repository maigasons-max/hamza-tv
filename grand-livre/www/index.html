<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AURA Global · Grand Livre</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<section id="cle" class="cle">
  <div class="cle-carte">
    <img src="logo.png" alt="AURA Global" class="cle-logo">
    <h1>Grand Livre</h1>
    <p class="cle-sous">Espace privé de comptabilité</p>
    <label class="etiquette" for="champ-cle">Clé d'accès</label>
    <input id="champ-cle" class="champ-cle" inputmode="text" autocomplete="off" spellcheck="false" placeholder="AURA-XXXXXX" maxlength="24">
    <p id="cle-erreur" class="cle-erreur" hidden></p>
    <button id="entrer" class="bouton-or">Entrer</button>
    <button id="creer-cle" class="bouton-lien">Créer un nouvel espace</button>
    <p class="cle-note">La clé donne accès aux écritures partagées de l'entreprise. Gardez-la confidentielle.</p>
  </div>
</section>

<div id="app" class="app" hidden>
  <header class="entete">
    <img src="logo.png" alt="" class="entete-logo">
    <div class="entete-texte">
      <strong id="entete-nom">AURA Global</strong>
      <span id="entete-etat" class="etat"><i class="pastille"></i> Local</span>
    </div>
    <button id="ouvrir-reglages" class="rond" aria-label="Réglages"></button>
  </header>

  <main id="vue" class="vue"></main>

  <button id="nouveau" class="nouveau" aria-label="Nouvelle écriture">+</button>

  <nav class="barre" id="barre">
    <button data-onglet="accueil" class="actif"></button>
    <button data-onglet="ecritures"></button>
    <button data-onglet="stock"></button>
    <button data-onglet="argent"></button>
    <button data-onglet="tout"></button>
  </nav>
</div>

<div id="feuille" class="feuille" hidden>
  <div class="feuille-fond" data-fermer></div>
  <div class="feuille-panneau" id="feuille-panneau"></div>
</div>

<div id="avis" class="avis" hidden></div>

<script src="app.js"></script>
</body>
</html>
